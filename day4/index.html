<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Form part 2</title>
    </head>
    <body>

        <form action>
            <label for="age">
                Enter Your age :
            </label>
            <input type="number" required min="18" max="30">
            <br>

            <label for="dob">
                DOB :
            </label>
            <input type="date">
            <br>

            <label for="attachment">
                Upload your resume :
            </label>
            <input type="file">
            <br>

            <label for="phone">
                Contact Details :
            </label>
            <input type="tel">
            <br>

            <label for="social">
                Enter you liked in profile :
            </label>

            <input type="url">
            <br>

            <label for="profile">Select You Job Profile :</label>
            <select>
                <option value>---select---</option>
                <option value="jr developer">Junior Developer</option>
                <option value="sr developer">Senior Developer</option>
                <option value="man">Manager</option>
            </select>
            <br>

            <label for="feedback">Feedback</label>
            <textarea name id maxlength="200"></textarea>
            
            <button type="submit">Submit</button>

        </form>

    </body>
</html>
