    <h1><big><b>Check If the Number is Even or Odd</b></big></h1>
</head>
<body>
    <p>The program here check if the number is Even or Odd</p>
    <code>
        <p>var num=6;</p>
        <p>if(num%2==0)</p>
        <p>document.write(num +"is an Even Number");</p>
        <p>else</p>
        <p>document.write(num +"is an Odd Number");</p>
    </code>
    <p>num here is the number that is getting checked</p>
    <p><big><b>Program Output</b></big></p>
    <p>6 is an Even Number</p>
    
</body>
