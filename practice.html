<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smartphone Product card</title>
    <link rel="stylesheet" href="practice.css">
</head>
<body>
    <div class="page"></div>
    <div class="product-card">
        <!--product image-->
        <img src="smartphone.jpg"
        <div class="image box">
            <img src="S25.jfif" atl="Samsung Galaxy S25 FE 5G">
        </div>

        <!--product details-->
        <div class="product-details">
            <p class="category">Smartphone</p>
            <h1 class="product-name">Samsung Galaxy S25 FE 5G</h1>
            <p class="price">RS. 49,999</p>
            <p class="description">Experience the future with the Samsung Galaxy S25 FE 5G. Featuring a stunning display and powerful performance, this smartphone is perfect for everyday use.</p>
           
            <div class="rating">
                <span class="star">★</span>
                <span class="star">★</span>
                <span class="star">★</span>
                <span class="star">★</span>
                <span class="star">★</span>
            </div>
            <p class="delivery">Free delivery within 5 days</p>
            <button class="add-to-cart">Add to Cart</button>
            <button class="buy-now">Buy Now</button>
        </div>
    </div>
    
</body>
</html>
